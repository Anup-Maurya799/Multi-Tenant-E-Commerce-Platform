name: Frontend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Verify production build succeeds
        run: npm run build
        env:
          VITE_API_BASE_URL: https://example.com/api/v1
          VITE_USE_MOCK_API: "false"
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
